name: dev-build

# Every push to dev builds the five platforms and publishes a GitHub
# release tagged v2.0.<N>: the first is v2.0.0, each later one the newest
# v2.0.* tag's patch plus one. A failed run makes no tag, so the next run
# reuses its number and versions have no gaps.
#
# Unsigned (sign: false): no update manifests, so installed copies never
# update to these builds; they are downloaded by hand.
#
# main stays a mirror of upstream; merge main into dev to take upstream's
# changes. This file only exists on dev, so the merge never conflicts on it.
on:
  push:
    branches: [dev]
    # Changes that don't change the app.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, never cancelled, so two pushes can't race for a tag.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        # Nothing when this commit already has its build (a re-run).
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v2.0.*')" ]; then
            echo "::notice::$(git tag --points-at HEAD --list 'v2.0.*') is already published for this commit"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v2.0.*' --sort=-v:refname | grep -E '^v2\.0\.[0-9]+$' | head -n 1 || true)
          if [ -z "$last" ]; then
            version=2.0.0
          else
            version="2.0.$(( ${last##*.} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Building v$version"

  # The same checks as pull requests: no build of a commit that fails them.
  gate:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, gate]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: false

  # Publishes whatever platforms were built, even one: a platform that
  # failed (GitHub's macOS runners are often out of capacity, and a job no
  # runner picks up ends cancelled, so always() rather than !cancelled())
  # is left out and named in the notes. Nothing is published when the gate
  # failed or no platform was built.
  publish:
    needs: [version, gate, build]
    if: >-
      always() && needs.gate.result == 'success' &&
      needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        # No artifact at all when every platform failed: the next step
        # stops then.
        continue-on-error: true
        with:
          path: upload
          merge-multiple: true
      - name: Check the platforms
        run: |
          mkdir -p upload
          ls -l upload
          built=0
          check() { # <name> <file pattern>
            if ls upload/$2 > /dev/null 2>&1; then
              built=$((built + 1))
            else
              echo "::warning::$1 was not built, publishing without it"
              echo "- $1" >> missing-platforms.txt
            fi
          }
          check "macOS arm64" "*-arm64.dmg"
          check "macOS amd64" "*-amd64.dmg"
          check "Linux amd64" "*-linux-amd64.tar.gz"
          check "Linux arm64" "*-linux-arm64.tar.gz"
          check "Windows amd64" "*-windows-amd64.zip"
          if [ "$built" -eq 0 ]; then
            echo "::error::No platform was built, nothing to publish"
            exit 1
          fi
      - name: Licenses and checksums
        run: |
          cp LICENSE upload/LICENSE.txt
          go run ./tools/release licenses > upload/THIRD_PARTY_LICENSES.txt
          (cd upload && sha256sum * > SHA256SUMS)
          cat upload/SHA256SUMS
      - name: Release notes
        # The commits since the previous dev build, then how to install.
        run: |
          sha=${GITHUB_SHA:0:7}
          link="[$sha]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
          last=$(git tag --list 'v2.0.*' --sort=-v:refname | grep -E '^v2\.0\.[0-9]+$' | head -n 1 || true)
          {
            echo "Build of dev at $link. / dev 分支在 $link 的构建。"
            echo
            if [ -f missing-platforms.txt ]; then
              echo "Not built this time / 本次未构建："
              echo
              cat missing-platforms.txt
              echo
            fi
            echo "## Changes"
            echo
            if [ -n "$last" ]; then
              git log --no-merges --format='- %s (%h)' "$last..HEAD" | head -n 200
            else
              git log --no-merges --format='- %s (%h)' -n 30 HEAD
            fi
            echo
            cat .github/release-install.md
          } > notes.md
      - name: Publish
        run: |
          gh release create "v$VERSION" upload/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest
