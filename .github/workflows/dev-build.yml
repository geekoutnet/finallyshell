name: dev-build

# Every push to dev builds the five platforms and publishes a GitHub
# release tagged v2.0.<N>: the first is v2.0.0, each later one the newest
# v2.0.* tag's patch plus one. A failed run makes no tag, so the next run
# reuses its number and versions have no gaps.
#
# Unsigned (sign: false): no update manifests, so installed copies never
# update to these builds; they are downloaded by hand.
#
# main stays a mirror of upstream; merge main into dev to take upstream's
# changes. This file only exists on dev, so the merge never conflicts on it.
on:
  push:
    branches: [dev]
    # Changes that don't change the app.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, never cancelled, so two pushes can't race for a tag.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        # Nothing when this commit already has its build (a re-run).
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v2.0.*')" ]; then
            echo "::notice::$(git tag --points-at HEAD --list 'v2.0.*') is already published for this commit"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v2.0.*' --sort=-v:refname | grep -E '^v2\.0\.[0-9]+$' | head -n 1 || true)
          if [ -z "$last" ]; then
            version=2.0.0
          else
            version="2.0.$(( ${last##*.} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Building v$version"

  # The same checks as pull requests: no build of a commit that fails them.
  gate:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, gate]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: false

  # Publishes when only some platforms failed (GitHub's macOS runners are
  # often out of capacity), as long as Linux and Windows are built; the
  # next step checks those. Never after a failed gate, which skips build.
  publish:
    needs: [version, build]
    if: >-
      !cancelled() && needs.version.outputs.version != '' &&
      (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          path: upload
          merge-multiple: true
      - name: Check the platforms
        # Linux and Windows are required; macOS is published when it built.
        run: |
          ls -l upload
          missing=
          for pattern in "*_amd64.deb" "*-linux-amd64.tar.gz" "*_arm64.deb" "*-linux-arm64.tar.gz" \
            "*-setup-*-amd64.exe" "*-windows-amd64.zip"; do
            ls upload/$pattern > /dev/null 2>&1 || missing="$missing $pattern"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not built:$missing"
            exit 1
          fi
          for arch in arm64 amd64; do
            if ! ls upload/*-"$arch".dmg > /dev/null 2>&1; then
              echo "::warning::macOS $arch was not built, publishing without it"
              echo "- macOS $arch" >> missing-platforms.txt
            fi
          done
      - name: Licenses and checksums
        run: |
          cp LICENSE upload/LICENSE.txt
          go run ./tools/release licenses > upload/THIRD_PARTY_LICENSES.txt
          (cd upload && sha256sum * > SHA256SUMS)
          cat upload/SHA256SUMS
      - name: Release notes
        # The commits since the previous dev build, then how to install.
        run: |
          sha=${GITHUB_SHA:0:7}
          link="[$sha]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
          last=$(git tag --list 'v2.0.*' --sort=-v:refname | grep -E '^v2\.0\.[0-9]+$' | head -n 1 || true)
          {
            echo "Build of dev at $link. / dev 分支在 $link 的构建。"
            echo
            if [ -f missing-platforms.txt ]; then
              echo "Not built this time / 本次未构建："
              echo
              cat missing-platforms.txt
              echo
            fi
            echo "## Changes"
            echo
            if [ -n "$last" ]; then
              git log --no-merges --format='- %s (%h)' "$last..HEAD" | head -n 200
            else
              git log --no-merges --format='- %s (%h)' -n 30 HEAD
            fi
            echo
            cat .github/release-install.md
          } > notes.md
      - name: Publish
        run: |
          gh release create "v$VERSION" upload/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest
